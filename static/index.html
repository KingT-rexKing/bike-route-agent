<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>バイクルート AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ════════════════════════════════════════════════
       TOKENS
    ════════════════════════════════════════════════ */
    :root {
      --bg:       #030305;
      --surface:  #0d0d16;
      --accent:   #E85000;
      --gold:     #C8A26A;
      --text:     #ebebeb;
      --muted:    rgba(235,235,235,0.42);
      --dim:      rgba(235,235,235,0.10);
      --border:   rgba(232,80,0,0.20);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
    }

    /* ════════════════════════════════════════════════
       CINEMA OVERLAY — 開場演出
    ════════════════════════════════════════════════ */
    #cinema {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
    }

    #cinema-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      letter-spacing: 0.22em;
      color: var(--text);
      line-height: 1;
      opacity: 0;
      transform: translateY(10px);
    }

    #cinema-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
    }

    /* accent line under logo */
    #cinema-line {
      width: 0;
      height: 1px;
      background: var(--accent);
      opacity: 0.6;
    }

    /* ════════════════════════════════════════════════
       MAP
    ════════════════════════════════════════════════ */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0; /* GSAP reveals this */
    }

    /* タイルペインにのみインバートフィルターを適用して日本語タイルを暗くする */
    .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.72) contrast(0.92) saturate(0.5);
    }

    .leaflet-control-attribution {
      background: rgba(3,3,5,0.70) !important;
      color: rgba(235,235,235,0.28) !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: rgba(235,235,235,0.38) !important; }

    .leaflet-control-zoom a {
      background: rgba(3,3,5,0.90) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      font-weight: 700;
      transition: color 0.15s, background 0.15s;
    }
    .leaflet-control-zoom a:hover {
      background: var(--surface) !important;
      color: var(--accent) !important;
    }

    /* ════════════════════════════════════════════════
       TOP BAR
    ════════════════════════════════════════════════ */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: linear-gradient(180deg, rgba(3,3,5,0.82) 0%, transparent 100%);
      pointer-events: none;
      opacity: 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.22em;
      color: var(--text);
    }

    #status-bar {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #status-bar.visible { opacity: 1; }

    /* ════════════════════════════════════════════════
       FORM PANEL
    ════════════════════════════════════════════════ */
    #form-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      width: 340px;
      z-index: 30;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 22px 22px 18px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,80,0,0.08);
      opacity: 0;
      transform: translateY(20px);
    }

    #plan-form { display: flex; flex-direction: column; gap: 10px; }

    /* Bottom-border inputs */
    .f-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--dim);
      border-radius: 0;
      padding: 9px 0 7px;
      color: var(--text);
      font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      width: 100%;
      outline: none;
      transition: border-color 0.18s ease;
      appearance: none;
      -webkit-appearance: none;
    }
    .f-input::placeholder { color: var(--muted); font-weight: 400; }
    .f-input:focus { border-bottom-color: var(--accent); }

    .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    select.f-input { cursor: pointer; }
    select.f-input option { background: #0d0d16; color: var(--text); }

    /* Divider between inputs and options */
    .f-divider {
      width: 100%;
      height: 1px;
      background: var(--dim);
      margin: 2px 0 0;
    }

    /* Toggle buttons */
    .f-toggles { display: flex; gap: 7px; padding: 1px 0; }

    .toggle-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 2px;
      border: 1px solid var(--dim);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.14s, color 0.14s, background 0.14s;
    }
    .toggle-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,80,0,0.08);
    }
    .toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Submit button with shimmer */
    #submit-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 0.18em;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.18s, transform 0.10s, box-shadow 0.18s;
    }
    #submit-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-20deg);
      transition: left 0.55s ease;
    }
    #submit-btn:hover:not(:disabled)::after { left: 160%; }
    #submit-btn:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(232,80,0,0.30);
    }
    #submit-btn:active:not(:disabled) { transform: none; box-shadow: none; }
    #submit-btn:disabled { opacity: 0.30; cursor: not-allowed; }
    #submit-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Loading state */
    #form-panel.loading #plan-form { opacity: 0.35; pointer-events: none; }
    .f-loading-text {
      display: none;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent); text-align: center; padding: 6px 0 0;
    }
    #form-panel.loading .f-loading-text { display: block; }

    /* Error */
    #form-error {
      display: none;
      font-size: 12px; font-weight: 600;
      color: var(--accent); line-height: 1.4;
      margin-top: 8px; opacity: 0;
      transform: translateY(-3px);
    }

    /* ════════════════════════════════════════════════
       RESULTS PANEL
    ════════════════════════════════════════════════ */
    #results-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 380px;
      z-index: 30;
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(100%);
      box-shadow: -8px 0 48px rgba(0,0,0,0.5);
    }

    #results-header {
      padding: 16px 20px 13px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #results-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--text);
    }
    #results-title em { font-style: normal; color: var(--accent); }

    #close-results {
      background: none; border: none;
      color: var(--muted); font-size: 17px;
      cursor: pointer; padding: 4px 7px; line-height: 1;
      transition: color 0.14s; border-radius: 2px;
    }
    #close-results:hover { color: var(--text); }
    #close-results:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Stats strip */
    #stats-strip {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat-cell {
      flex: 1;
      padding: 11px 14px 10px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 3px;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-lbl {
      font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
    }
    .stat-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem; font-weight: 700; line-height: 1;
      color: var(--text);
    }
    .stat-unit { font-size: 9.5px; color: var(--muted); font-weight: 600; margin-left: 1px; }

    /* Scrollable body */
    #results-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 20px 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #results-body::-webkit-scrollbar { width: 3px; }
    #results-body::-webkit-scrollbar-track { background: transparent; }
    #results-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Timeline rows */
    .tl-row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 11px 0;
      border-bottom: 1px solid var(--dim);
      opacity: 0; /* stagger entrance via GSAP */
      transform: translateX(10px);
    }
    .tl-row:last-child { border-bottom: none; }

    .tl-num {
      font-size: 10.5px; font-weight: 700;
      color: var(--muted); padding-top: 1px;
      font-family: 'Rajdhani', sans-serif;
    }
    .tl-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .tl-meta { font-size: 10px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
    .tl-time {
      font-size: 11px; font-weight: 700;
      color: var(--gold); white-space: nowrap;
      padding-top: 1px; text-align: right;
      font-family: 'Rajdhani', sans-serif;
    }
    .tl-depart {
      display: block; font-size: 9px;
      color: var(--muted); font-weight: 600; margin-top: 2px;
    }

    .cat-badge {
      display: inline-block;
      padding: 1px 6px; border-radius: 2px;
      font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-top: 3px;
    }
    .cat-restaurant, .cat-cafe { background: rgba(200,162,106,0.12); color: var(--gold); }
    .cat-gas_station { background: rgba(232,80,0,0.10); color: var(--accent); }
    .cat-viewpoint, .cat-museum, .cat-attraction,
    .cat-park, .cat-shrine, .cat-temple {
      background: rgba(235,235,235,0.06); color: rgba(235,235,235,0.65);
    }

    #plan-prose {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 11.5px; line-height: 1.75;
      color: var(--muted);
      white-space: pre-wrap; word-break: break-word;
      font-family: 'Noto Sans JP', sans-serif; font-weight: 400;
    }

    /* ════════════════════════════════════════════════
       MOBILE
    ════════════════════════════════════════════════ */
    @media (max-width: 640px) {
      #form-panel { left: 12px; right: 12px; bottom: 12px; width: auto; }
      #cinema-logo { font-size: 2.4rem; }
      #results-panel {
        top: auto; left: 0; right: 0; bottom: 0;
        width: 100%; height: 65vh;
        border-left: none; border-top: 1px solid var(--border);
        transform: translateY(100%);
      }
    }

    /* ════════════════════════════════════════════════
       REDUCED MOTION
    ════════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      #cinema { display: none !important; }
      #map { opacity: 1 !important; }
      #topbar { opacity: 1 !important; }
      #form-panel { opacity: 1 !important; transform: none !important; }
      #results-panel { transition: none !important; }
      .tl-row { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>

<!-- ══ CINEMA OVERLAY ════════════════════════════════ -->
<div id="cinema" aria-hidden="true">
  <div id="cinema-line"></div>
  <div id="cinema-logo">バイクルート AI</div>
  <div id="cinema-sub">下道専用 &nbsp;·&nbsp; AI ルートプランナー</div>
</div>

<!-- ══ MAP ═══════════════════════════════════════════ -->
<div id="map" role="application" aria-label="ルートマップ"></div>

<!-- ══ TOP BAR ═══════════════════════════════════════ -->
<header id="topbar">
  <span class="logo">バイクルート AI</span>
  <span id="status-bar" role="status" aria-live="polite" aria-atomic="true"></span>
</header>

<!-- ══ FORM PANEL ════════════════════════════════════ -->
<div id="form-panel">
  <form id="plan-form" novalidate aria-label="ルート生成フォーム">

    <input class="f-input" type="text" name="origin"
      placeholder="出発地 — 新宿区, 東京都"
      aria-label="出発地" autocomplete="off" required />

    <input class="f-input" type="text" name="destination"
      placeholder="目的地 — 富士吉田市, 山梨県"
      aria-label="目的地" autocomplete="off" required />

    <div class="f-row">
      <input class="f-input" type="time" name="start_time"
        value="08:00" aria-label="出発時刻" />
      <input class="f-input" type="time" name="end_time"
        value="18:00" aria-label="帰着時刻" />
    </div>

    <div class="f-row">
      <select class="f-input" name="engine_cc" aria-label="排気量">
        <option value="125cc">125cc</option>
        <option value="50cc">50cc</option>
      </select>
      <select class="f-input" name="travel_style" aria-label="旅スタイル">
        <option value="お任せ">バランス</option>
        <option value="風景">絶景優先</option>
        <option value="人文">史跡優先</option>
      </select>
    </div>

    <div class="f-divider"></div>

    <div class="f-toggles" role="group" aria-label="立ち寄りオプション">
      <button type="button" class="toggle-btn active" data-key="want_meal">食事</button>
      <button type="button" class="toggle-btn" data-key="want_gas">給油</button>
    </div>

    <button type="submit" id="submit-btn">ルートを生成</button>
  </form>

  <div class="f-loading-text" aria-live="polite">計算中...</div>
  <div id="form-error" role="alert"></div>
</div>

<!-- ══ RESULTS PANEL ═════════════════════════════════ -->
<aside id="results-panel" aria-hidden="true" aria-label="生成されたルート">
  <div id="results-header">
    <div id="results-title">走行<em>ルート</em></div>
    <button id="close-results" aria-label="結果を閉じる">✕</button>
  </div>
  <div id="stats-strip" aria-label="ルート統計"></div>
  <div id="results-body">
    <div id="timeline-list" role="list" aria-label="タイムライン"></div>
    <pre id="plan-prose" aria-label="行程プラン"></pre>
  </div>
</aside>


<script>
// ══════════════════════════════════════════════════════
// 1.  MAP
// ══════════════════════════════════════════════════════

const map = L.map('map', {
  center: [35.68, 138.5],  // 本州中央
  zoom: 8,                  // 日本語ラベルが見えるズームレベル
  zoomControl: true,
  attributionControl: true,
});

map.zoomControl.setPosition('bottomright');

// 国土地理院タイル（日本語地名）+ CSSインバートで暗くする
L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
  {
    attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
    maxZoom: 18,
  }
).addTo(map);

let routeLine   = null;
let spotMarkers = [];

function clearMapOverlays() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  spotMarkers.forEach(m => map.removeLayer(m));
  spotMarkers = [];
}

// ルートラインをアニメーション付きで描画
function drawRoute(geometry, spots) {
  clearMapOverlays();

  if (geometry && geometry.length > 0) {
    const latLngs = geometry.map(([lon, lat]) => [lat, lon]);
    routeLine = L.polyline(latLngs, {
      color: '#E85000', weight: 4, opacity: 0.95,
      lineJoin: 'round', lineCap: 'round',
    }).addTo(map);

    map.fitBounds(routeLine.getBounds(), { padding: [70, 70] });

    // SVG stroke-dashoffset で「描かれる」アニメーション
    if (!prefersReducedMotion) {
      const pathEl = routeLine.getElement();
      if (pathEl && pathEl.getTotalLength) {
        const len = pathEl.getTotalLength();
        pathEl.style.strokeDasharray  = len;
        pathEl.style.strokeDashoffset = len;
        gsap.to(pathEl, {
          strokeDashoffset: 0,
          duration: 1.8,
          ease: 'power2.inOut',
          delay: 0.1,
        });
      }
    }
  }

  (spots || []).forEach(spot => {
    if (!spot.lat || !spot.lon) return;
    const icon = L.divIcon({
      className: '',
      html: '<div style="width:9px;height:9px;background:#C8A26A;border:2px solid #E85000;border-radius:50%;box-shadow:0 0 6px rgba(232,80,0,0.5)"></div>',
      iconSize: [9, 9], iconAnchor: [4, 4],
    });
    const m = L.marker([spot.lat, spot.lon], { icon });
    m.bindPopup(
      `<span style="font-family:Rajdhani,sans-serif;font-weight:700;font-size:13px;color:#ebebeb">${escapeHtml(spot.name)}</span>`,
      { className: 'dark-popup' }
    );
    m.addTo(map);
    spotMarkers.push(m);
  });
}


// ══════════════════════════════════════════════════════
// 2.  CINEMA OPENING SEQUENCE — 開場演出
// ══════════════════════════════════════════════════════

const prefersReducedMotion =
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function playOpeningSequence() {
  if (prefersReducedMotion) return; // CSSが即表示に切り替え

  const tl = gsap.timeline();

  // ロゴラインが伸びる
  tl.to('#cinema-line', {
    width: 180, opacity: 0.6,
    duration: 0.45, ease: 'power3.out',
  }, 0.2);

  // ロゴ文字が浮かび上がる
  tl.to('#cinema-logo', {
    opacity: 1, y: 0,
    duration: 0.55, ease: 'expo.out',
  }, 0.35);

  // サブテキスト
  tl.to('#cinema-sub', {
    opacity: 1,
    duration: 0.40, ease: 'power2.out',
  }, 0.75);

  // 地図フェードイン（オーバーレイの後ろで準備）
  tl.to('#map', {
    opacity: 1, duration: 0.6, ease: 'power2.out',
  }, 1.30);

  // オーバーレイをフェードアウト
  tl.to('#cinema', {
    opacity: 0, duration: 0.65, ease: 'power2.inOut',
    onComplete: () => {
      document.getElementById('cinema').style.display = 'none';
    },
  }, 1.55);

  // 地図コンテナサイズを再計算（固定レイアウトの初期化タイミング対策）
  tl.call(() => map.invalidateSize(), [], 1.35);

  // トップバー表示
  tl.to('#topbar', {
    opacity: 1, duration: 0.4, ease: 'power2.out',
  }, 1.80);

  // フォームスライドアップ
  tl.to('#form-panel', {
    opacity: 1, y: 0,
    duration: 0.65, ease: 'expo.out',
  }, 1.90);
}

window.addEventListener('load', () => {
  map.invalidateSize();
  playOpeningSequence();
});


// ══════════════════════════════════════════════════════
// 3.  TOGGLE BUTTONS
// ══════════════════════════════════════════════════════

const toggleState = { want_meal: true, want_gas: false };

document.querySelectorAll('.toggle-btn').forEach(btn => {
  const key = btn.dataset.key;
  btn.setAttribute('aria-pressed', String(toggleState[key]));
  btn.addEventListener('click', () => {
    toggleState[key] = !toggleState[key];
    btn.classList.toggle('active', toggleState[key]);
    btn.setAttribute('aria-pressed', String(toggleState[key]));
  });
});


// ══════════════════════════════════════════════════════
// 4.  STATUS BAR CYCLING
// ══════════════════════════════════════════════════════

const LOADING_STEPS = [
  '地名を解析中',
  '下道ルートを計算中',
  '時間配分を最適化中',
  '沿道スポットを検索中',
  '行程プランを生成中',
];

let loadingTimer = null;

function setStatus(text) {
  const el = document.getElementById('status-bar');
  el.textContent = text;
  el.classList.toggle('visible', Boolean(text));
}

function startLoadingCycle() {
  let i = 0;
  setStatus(LOADING_STEPS[i]);
  loadingTimer = setInterval(() => {
    i = (i + 1) % LOADING_STEPS.length;
    setStatus(LOADING_STEPS[i]);
  }, 2200);
}

function stopLoadingCycle() {
  clearInterval(loadingTimer);
  loadingTimer = null;
  setStatus('');
}


// ══════════════════════════════════════════════════════
// 5.  ERROR HELPERS
// ══════════════════════════════════════════════════════

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = 'block';
  gsap.to(el, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' });
}

function clearError() {
  const el = document.getElementById('form-error');
  if (el.style.display === 'none') return;
  gsap.to(el, {
    opacity: 0, y: -3, duration: 0.18, ease: 'power2.in',
    onComplete: () => { el.style.display = 'none'; el.textContent = ''; },
  });
}


// ══════════════════════════════════════════════════════
// 6.  FORM SUBMIT
// ══════════════════════════════════════════════════════

document.getElementById('plan-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const fd          = new FormData(e.target);
  const origin      = fd.get('origin').trim();
  const destination = fd.get('destination').trim();

  if (!origin) {
    showError('出発地を入力してください');
    e.target.querySelector('[name="origin"]').focus();
    return;
  }
  if (!destination) {
    showError('目的地を入力してください');
    e.target.querySelector('[name="destination"]').focus();
    return;
  }

  const payload = {
    origin, destination,
    start_time:   fd.get('start_time'),
    end_time:     fd.get('end_time'),
    engine_cc:    fd.get('engine_cc'),
    want_meal:    toggleState.want_meal,
    want_gas:     toggleState.want_gas,
    travel_style: fd.get('travel_style'),
  };

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('form-panel').classList.add('loading');
  startLoadingCycle();

  try {
    const resp = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) {
      const errBody = await resp.json().catch(() => ({}));
      throw new Error(errBody.detail || `サーバーエラー (${resp.status})`);
    }
    const result = await resp.json();
    showResults(result, payload);
  } catch (err) {
    showError(err.message || '通信エラーが発生しました');
  } finally {
    stopLoadingCycle();
    document.getElementById('form-panel').classList.remove('loading');
    document.getElementById('submit-btn').disabled = false;
  }
});


// ══════════════════════════════════════════════════════
// 7.  RENDER RESULTS + STAGGER ANIMATION
// ══════════════════════════════════════════════════════

const CAT_LABELS = {
  restaurant: 'レストラン', cafe: 'カフェ',
  gas_station: '給油所', viewpoint: '展望台',
  museum: '博物館', attraction: '観光地',
  park: '公園', shrine: '神社', temple: '寺院',
};

function showResults(result, req) {
  drawRoute(result.geometry, result.spots_for_map);

  document.getElementById('results-title').innerHTML =
    `${escapeHtml(req.origin)} <em>→</em> ${escapeHtml(req.destination)}`;

  const budget = result.time_budget || {};
  document.getElementById('stats-strip').innerHTML = [
    { lbl: '総距離',   val: result.distance_km ?? '—', unit: 'km'   },
    { lbl: '走行時間', val: budget.riding_min   ?? '—', unit: 'min'  },
    { lbl: 'スポット', val: budget.n_spots      ?? '—', unit: '箇所' },
    { lbl: '食事',     val: budget.n_meals      ?? '—', unit: '回'   },
  ].map(s => `
    <div class="stat-cell">
      <span class="stat-lbl">${s.lbl}</span>
      <span class="stat-val">${s.val}<span class="stat-unit"> ${s.unit}</span></span>
    </div>
  `).join('');

  const rows = result.timeline || [];
  if (rows.length > 0) {
    document.getElementById('timeline-list').innerHTML = rows.map(row => {
      const catKey = row.category || 'attraction';
      return `
        <div class="tl-row" role="listitem">
          <div class="tl-num">${row.order}</div>
          <div>
            <div class="tl-name">${escapeHtml(row.name)}</div>
            <div class="tl-meta">
              ${row.stay_min}分滞在 · ${row.dist_km}km
              <br><span class="cat-badge cat-${catKey}">${CAT_LABELS[catKey] || catKey}</span>
            </div>
          </div>
          <div class="tl-time">
            ${row.arrive}
            <span class="tl-depart">→ ${row.depart}</span>
          </div>
        </div>`;
    }).join('');
  } else {
    document.getElementById('timeline-list').innerHTML =
      '<p style="color:var(--muted);font-size:12px;padding:8px 0">スポットが見つかりませんでした</p>';
  }

  document.getElementById('plan-prose').textContent = result.plan_text || '';

  openResultsPanel();
}


// ══════════════════════════════════════════════════════
// 8.  RESULTS PANEL OPEN / CLOSE
// ══════════════════════════════════════════════════════

function isMobile() { return window.innerWidth <= 640; }

function openResultsPanel() {
  const panel = document.getElementById('results-panel');
  panel.setAttribute('aria-hidden', 'false');

  if (prefersReducedMotion) {
    gsap.set(panel, { x: 0, y: 0 });
    animateTimelineRows();
    map.invalidateSize();
    return;
  }

  if (isMobile()) {
    gsap.fromTo(panel, { y: '100%', x: 0 },
      { y: 0, duration: 0.55, ease: 'expo.out',
        onComplete: () => { animateTimelineRows(); map.invalidateSize(); } }
    );
  } else {
    gsap.fromTo(panel, { x: '100%', y: 0 },
      { x: 0, duration: 0.55, ease: 'expo.out',
        onComplete: () => { animateTimelineRows(); map.invalidateSize(); } }
    );
  }
}

// タイムライン各行をずらして入場
function animateTimelineRows() {
  if (prefersReducedMotion) {
    document.querySelectorAll('.tl-row').forEach(r => {
      r.style.opacity = 1; r.style.transform = 'none';
    });
    return;
  }
  gsap.to('.tl-row', {
    opacity: 1, x: 0,
    duration: 0.30, ease: 'power2.out',
    stagger: 0.05, delay: 0.05,
  });
}

function closeResultsPanel() {
  const panel = document.getElementById('results-panel');

  if (prefersReducedMotion) {
    gsap.set(panel, {
      x: isMobile() ? 0 : '100%',
      y: isMobile() ? '100%' : 0,
    });
    panel.setAttribute('aria-hidden', 'true');
    clearMapOverlays();
    map.invalidateSize();
    return;
  }

  const animProps = isMobile() ? { y: '100%', x: 0 } : { x: '100%', y: 0 };
  gsap.to(panel, {
    ...animProps,
    duration: 0.38, ease: 'power3.in',
    onComplete: () => {
      panel.setAttribute('aria-hidden', 'true');
      clearMapOverlays();
      map.invalidateSize();
    },
  });
}

document.getElementById('close-results').addEventListener('click', closeResultsPanel);


// ══════════════════════════════════════════════════════
// 9.  XSS HELPER
// ══════════════════════════════════════════════════════

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
